<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cute Profile</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#bde8ff,#dff5ff,#eefcff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:350px;
    background:white;
    border-radius:25px;
    padding:30px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    border:4px solid #9edcff;
}

.profile{
    width:100px;
    height:100px;
    margin:auto;
    border-radius:50%;
    background:#b8e7ff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:50px;
}

h1{
    color:#3399ff;
    margin-top:15px;
}

p{
    color:#555;
    margin:10px 0;
    font-size:17px;
}

.info{
    background:#e8f8ff;
    padding:12px;
    margin-top:12px;
    border-radius:15px;
}

.footer{
    margin-top:20px;
    color:#3399ff;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

<div class="profile">💙</div>

<h1>Nuri Maulida Sembiring</h1>

<div class="info">
<p>🌸 <b>Nama</b><br>Nuri Maulida Sembiring</p>
</div>

<div class="info">
<p>☕ <b>Minuman Favorite</b><br>Coffee Latte</p>
</div>

<div class="info">
<p>🩵 <b>Favorite Color</b><br>Blue</p>
</div>

<div class="footer">
✨ Keep Smiling & Stay Happy ✨
</div>

</div>

</body>
</html>
